server {
    listen 80;
    listen [::]:80;
    server_name archub.ge www.archub.ge;

    return 301 https://archub.ge$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archub.ge www.archub.ge;

    ssl_certificate /etc/letsencrypt/live/archub.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archub.ge/privkey.pem;

    client_max_body_size 16m;
    large_client_header_buffers 4 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded filenames are content-addressed/unique and may be cached long-term.
    location ^~ /static/uploads/ {
        alias /opt/archub/static/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate code assets; HTML also includes an mtime query cache-buster.
    location ^~ /static/ {
        alias /opt/archub/static/;
        access_log off;
        expires off;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
