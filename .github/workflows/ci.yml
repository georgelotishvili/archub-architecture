name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Validate dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests
      - name: Run regression tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-only-secret-key-that-is-never-used-in-production
        run: python -m pytest -q
      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Check JavaScript syntax
        run: |
          node --check static/js/script.js
          node --check static/js/admin.js
      - name: Check deployment shell syntax
        run: |
          bash -n deployment/common.sh
          bash -n deployment/preflight_backup.sh
          bash -n deployment/deploy.sh
